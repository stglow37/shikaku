<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760">
  <defs>
    <style>
      .title { font: 700 26px sans-serif; fill: #172033; }
      .label { font: 700 23px sans-serif; fill: #172033; }
      .body { font: 20px sans-serif; fill: #172033; }
      .small { font: 17px sans-serif; fill: #334155; }
      .grid { stroke: #172033; stroke-width: 2.5; fill: none; }
      .cut { stroke: #475569; stroke-width: 1.8; }
      .repeat { stroke: #64748b; stroke-width: 1.4; stroke-dasharray: 6 6; }
    </style>
  </defs>

  <rect width="1100" height="760" fill="#ffffff"/>
  <text x="550" y="38" text-anchor="middle" class="title">16t × 16t 명시적 구성의 네 영역</text>

  <!-- Outer square and four vertically stacked regions; heights are proportional. -->
  <rect x="70" y="70" width="640" height="640" class="grid"/>

  <!-- Region A: 4t rows -->
  <rect x="70" y="70" width="640" height="160" fill="#dbeafe"/>
  <line x1="70" y1="110" x2="710" y2="110" class="repeat"/>
  <line x1="70" y1="150" x2="710" y2="150" class="repeat"/>
  <line x1="70" y1="190" x2="710" y2="190" class="repeat"/>
  <line x1="185" y1="70" x2="185" y2="110" class="cut"/>
  <line x1="305" y1="110" x2="305" y2="150" class="cut"/>
  <line x1="425" y1="150" x2="425" y2="190" class="cut"/>
  <line x1="545" y1="190" x2="545" y2="230" class="cut"/>
  <text x="90" y="99" class="label">A</text>
  <text x="390" y="99" text-anchor="middle" class="body">w  |  16t−w</text>

  <!-- Region B: t rows -->
  <rect x="70" y="230" width="640" height="40" fill="#dcfce7"/>
  <line x1="165" y1="230" x2="165" y2="270" class="cut"/>
  <line x1="390" y1="230" x2="390" y2="270" class="cut"/>
  <line x1="525" y1="230" x2="525" y2="270" class="cut"/>
  <text x="90" y="257" class="label">B</text>
  <text x="390" y="257" text-anchor="middle" class="small">w | 8t−w | w′ | 8t−w′</text>

  <!-- Region C: 4t strips of height 2 -->
  <rect x="70" y="270" width="640" height="320" fill="#fef3c7"/>
  <line x1="70" y1="350" x2="710" y2="350" class="repeat"/>
  <line x1="70" y1="430" x2="710" y2="430" class="repeat"/>
  <line x1="70" y1="510" x2="710" y2="510" class="repeat"/>
  <line x1="320" y1="270" x2="320" y2="350" class="cut"/>
  <line x1="385" y1="350" x2="385" y2="430" class="cut"/>
  <line x1="450" y1="430" x2="450" y2="510" class="cut"/>
  <line x1="515" y1="510" x2="515" y2="590" class="cut"/>
  <text x="90" y="315" class="label">C</text>
  <text x="390" y="315" text-anchor="middle" class="body">w  |  16t−w</text>
  <text x="390" y="466" text-anchor="middle" class="small">높이 2인 띠 4t개</text>

  <!-- Region D: t strips of height 3 -->
  <rect x="70" y="590" width="640" height="120" fill="#fce7f3"/>
  <line x1="70" y1="650" x2="710" y2="650" class="repeat"/>
  <line x1="335" y1="590" x2="335" y2="650" class="cut"/>
  <line x1="500" y1="650" x2="500" y2="710" class="cut"/>
  <text x="90" y="625" class="label">D</text>
  <text x="390" y="625" text-anchor="middle" class="body">w  |  16t−w</text>

  <!-- Right-side annotations -->
  <line x1="735" y1="70" x2="735" y2="230" class="grid"/>
  <line x1="725" y1="70" x2="745" y2="70" class="grid"/>
  <line x1="725" y1="230" x2="745" y2="230" class="grid"/>
  <text x="760" y="135" class="body">4t행</text>
  <text x="760" y="166" class="small">홀수 넓이 8t종</text>

  <line x1="735" y1="230" x2="735" y2="270" class="grid"/>
  <line x1="725" y1="270" x2="745" y2="270" class="grid"/>
  <text x="760" y="257" class="body">t행 · 짝수 4t−1종</text>

  <line x1="735" y1="270" x2="735" y2="590" class="grid"/>
  <line x1="725" y1="590" x2="745" y2="590" class="grid"/>
  <text x="760" y="410" class="body">8t행</text>
  <text x="760" y="441" class="small">짝수 넓이 8t종</text>

  <line x1="735" y1="590" x2="735" y2="710" class="grid"/>
  <line x1="725" y1="710" x2="745" y2="710" class="grid"/>
  <text x="760" y="635" class="body">3t행</text>
  <text x="760" y="666" class="small">큰 홀수 2t종</text>

  <!-- Redraw boundaries above the colored regions. -->
  <line x1="70" y1="230" x2="710" y2="230" class="grid"/>
  <line x1="70" y1="270" x2="710" y2="270" class="grid"/>
  <line x1="70" y1="590" x2="710" y2="590" class="grid"/>
  <rect x="70" y="70" width="640" height="640" class="grid"/>

  <text x="70" y="742" class="small">점선은 같은 유형의 행 또는 띠가 반복됨을 나타낸다. 세로 절단 위치는 구조를 설명하기 위한 예시이다.</text>
</svg>
