<svg xmlns="http://www.w3.org/2000/svg" width="760" height="700" viewBox="0 0 760 700" role="img" aria-labelledby="title desc">
  <title id="title">16×16 직사각형 분할</title>
  <desc id="desc">A부터 D까지 네 영역으로 나뉜 실제 분할이며, 각 직사각형 안의 숫자는 넓이이다.</desc>
  <defs>
    <style>
      .piece { stroke: #263238; stroke-width: 2.4; }
      .outer { fill: none; stroke: #111827; stroke-width: 3.6; }
      .area { fill: #111827; font: 600 25px "Noto Sans KR", "Malgun Gothic", sans-serif; text-anchor: middle; dominant-baseline: middle; }
      .region { fill: #111827; font: 700 27px "Noto Sans KR", "Malgun Gothic", sans-serif; text-anchor: middle; dominant-baseline: middle; }
    </style>
  </defs>

  <rect width="760" height="700" fill="#ffffff"/>

  <!-- A: four height-1 rows -->
  <g fill="#dceaf7">
    <rect class="piece" x="80" y="30" width="40" height="40"/>
    <rect class="piece" x="120" y="30" width="600" height="40"/>
    <rect class="piece" x="80" y="70" width="120" height="40"/>
    <rect class="piece" x="200" y="70" width="520" height="40"/>
    <rect class="piece" x="80" y="110" width="200" height="40"/>
    <rect class="piece" x="280" y="110" width="440" height="40"/>
    <rect class="piece" x="80" y="150" width="280" height="40"/>
    <rect class="piece" x="360" y="150" width="360" height="40"/>
  </g>
  <g class="area">
    <text x="100" y="50">1</text><text x="420" y="50">15</text>
    <text x="140" y="90">3</text><text x="460" y="90">13</text>
    <text x="180" y="130">5</text><text x="500" y="130">11</text>
    <text x="220" y="170">7</text><text x="540" y="170">9</text>
  </g>

  <!-- B: one height-1 row -->
  <g fill="#f8e4cf">
    <rect class="piece" x="80" y="190" width="80" height="40"/>
    <rect class="piece" x="160" y="190" width="240" height="40"/>
    <rect class="piece" x="400" y="190" width="160" height="40"/>
    <rect class="piece" x="560" y="190" width="160" height="40"/>
  </g>
  <g class="area">
    <text x="120" y="210">2</text><text x="280" y="210">6</text>
    <text x="480" y="210">4</text><text x="640" y="210">4</text>
  </g>

  <!-- C: four height-2 strips -->
  <g fill="#deefd8">
    <rect class="piece" x="80" y="230" width="160" height="80"/>
    <rect class="piece" x="240" y="230" width="480" height="80"/>
    <rect class="piece" x="80" y="310" width="200" height="80"/>
    <rect class="piece" x="280" y="310" width="440" height="80"/>
    <rect class="piece" x="80" y="390" width="240" height="80"/>
    <rect class="piece" x="320" y="390" width="400" height="80"/>
    <rect class="piece" x="80" y="470" width="280" height="80"/>
    <rect class="piece" x="360" y="470" width="360" height="80"/>
  </g>
  <g class="area">
    <text x="160" y="270">8</text><text x="480" y="270">24</text>
    <text x="180" y="350">10</text><text x="500" y="350">22</text>
    <text x="200" y="430">12</text><text x="520" y="430">20</text>
    <text x="220" y="510">14</text><text x="540" y="510">18</text>
  </g>

  <!-- D: one height-3 strip -->
  <g fill="#e8e0f2">
    <rect class="piece" x="80" y="550" width="280" height="120"/>
    <rect class="piece" x="360" y="550" width="360" height="120"/>
  </g>
  <g class="area">
    <text x="220" y="610">21</text><text x="540" y="610">27</text>
  </g>

  <rect class="outer" x="80" y="30" width="640" height="640"/>

  <g class="region">
    <text x="42" y="110">A</text>
    <text x="42" y="210">B</text>
    <text x="42" y="390">C</text>
    <text x="42" y="610">D</text>
  </g>
</svg>
